name: Kursinhalte prüfen

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - .pykim/trainer-hashes.json
  pull_request:
    branches: [main, beta]

permissions:
  contents: write

concurrency:
  group: kursinhalte-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - name: Kurs prüfen und Trainer-Hashliste erzeugen
        run: python tools/validate_content.py --write-hashes
      - name: Hashliste im Pull Request prüfen
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- .pykim/trainer-hashes.json
      - name: Hashliste zurückschreiben
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- .pykim/trainer-hashes.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pykim/trainer-hashes.json
          git commit -m "chore: Trainerhashes aktualisieren"
          git push
