name: Trainerdaten hashen

on:
  push:
    branches:
      - main
      - beta
    paths:
      - "Trainer/**"
      - ".github/workflows/main.yml"

  pull_request:
    branches:
      - main
      - beta
    paths:
      - "Trainer/**"
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: trainer-hashes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trainer-hashes:
    name: Trainer-Hashliste erzeugen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trainer-Hashliste erzeugen
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          trainer_root = root / "Trainer"

          if not trainer_root.is_dir():
              raise SystemExit("Der Ordner Trainer fehlt.")

          trainer_files = sorted(trainer_root.rglob("*.yml"))

          if not trainer_files:
              raise SystemExit("Es wurden keine Trainerdateien gefunden.")

          files = {}

          for path in trainer_files:
              data = path.read_bytes()
              relative_path = path.relative_to(root).as_posix()

              files[relative_path] = {
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }

          document = {
              "format": 1,
              "algorithm": "sha256",
              "scope": "trainer",
              "files": files,
          }

          target = root / ".pykim" / "trainer-hashes.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"{len(files)} Trainerdateien gehasht.")
          PYTHON

      - name: Hashliste im Pull Request prüfen
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- .pykim/trainer-hashes.json)" ]; then
            echo "::error::.pykim/trainer-hashes.json ist nicht aktuell."
            exit 1
          fi

      - name: Hashliste committen
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- .pykim/trainer-hashes.json)" ]; then
            echo "Die Trainer-Hashliste ist bereits aktuell."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .pykim/trainer-hashes.json
          git commit -m "chore: Trainerhashes aktualisieren"
          git push origin "HEAD:${GITHUB_REF_NAME}"
